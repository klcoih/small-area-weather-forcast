# AutoResearch 超参数配置文件
# 每个模型的参数组合列表，AutoResearch 会遍历搜索

arima:
  seasonal: [true, false]
  m: [96]
  max_p: [5]
  max_d: [2]
  max_q: [5]
  stepwise: [true]
  information_criterion: ["aic"]

prophet:
  changepoint_prior_scale: [0.05, 0.1, 0.5]
  seasonality_prior_scale: [5.0, 10.0]
  yearly_seasonality: [true, false]
  daily_seasonality: [true]
  interval_width: [0.8]

xgboost:
  max_depth: [6, 8]
  learning_rate: [0.05, 0.1]
  n_estimators: [300, 500]
  subsample: [0.8]
  colsample_bytree: [0.8]
  reg_alpha: [0, 0.1]
  reg_lambda: [1]
  min_child_weight: [1, 3]

lstm:
  num_layers: [2, 3]
  hidden_size: [64, 128]
  dropout: [0.2, 0.3]
  learning_rate: [0.001]
  seq_length: [96, 192]
  batch_size: [64]
  epochs: [30, 50]

markov:
  n_states: [2, 4]
  thresholds: [[0.1], [0.1, 1.0, 5.0]]
  n_steps: [1]

training:
  device: "cuda"
  random_seed: 42
  patience: 10

target_specific:
  wind_direction:
    xgboost:
      max_depth: [6]
      learning_rate: [0.05]
      n_estimators: [300]
  rainfall:
    xgboost:
      classification:
        max_depth: [5]
        learning_rate: [0.1]
        n_estimators: [200]
      regression:
        max_depth: [6]
        learning_rate: [0.05]
        n_estimators: [300]